<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="shortcut icon" href="./assets/img/agricultura.png" type="image/x-icon">
    <title>AgriSmart</title>
</head>

<body>
    <div class="container">
        <header class="header">
            <nav class="navbar">
                <div class="header-titles">
                    <h3>Dashboard Web</h3>
                    <p>Monitoramento microclimático</p>
                </div>
                <div class="header-options">
                    <select class="seletor-estufa" id="seletor-estufa">
                        <option value="lavoura_north">Lavoura Norte</option>
                        <option value="lavoura_south">Lavoura Sul</option>
                        <option value="lavoura_east">Lavoura Leste</option>
                        <option value="lavoura_west">Lavoura Oeste</option>
                    </select>
                </div>
                <div class="status-box">
                    <div id="status-ball" class="ball online"></div>
                    <p id="status-text">Online - Sincronizado</p>
                </div>
            </nav>
        </header>

        <main class="main">
            <h1 class="main-title">Dados da <span id="name-prop"></span></h1>

            <div class="cards">
                <div class="cards-items" id="card-temp">
                    <img src="./assets/img/temperaturas.png" draggable="false" alt="Temperatura">
                    <p class="card-label">Temperatura</p>
                    <p class="card-value" id="temperatura">--ºC</p>
                </div>

                <div class="cards-items" id="card-alt">
                    <img src="./assets/img/altitude.png" draggable="false" alt="Altitude">
                    <p class="card-label">Altitude</p>
                    <p class="card-value" id="altitude">--m</p>
                </div>

                <div class="cards-items" id="card-pressao">
                    <img src="./assets/img/pressao.png" draggable="false" alt="Pressão Atmosférica">
                    <p class="card-label">Pressão Atmosférica</p>
                    <p class="card-value" id="pressao">--hPa</p>
                </div>
            </div>

            <div class="box-historico">
                <button class="btn-grafico" id="btn-grafico">Gerar Gráfico</button>
            </div>
            <div id="grafico-wrapper" class="grafico-wrapper">
                <button class="btn-grafico" id="btn-voltar">⬅ Voltar aos Dados atuais</button>
                <div class="grafico-canvas-container">
                    <canvas id="chart"></canvas>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>Copyright © 2026, AgriSmart Corporation. All Rights Reserved.</p>
        </footer>
    </div>
    <script type="module" src="./js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>

</html>
